<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #00d4ff;
    }
    .info {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #scanBtn {
      background: #00d4ff;
      color: #1a1a2e;
    }
    #downloadBtn {
      background: #00ff88;
      color: #1a1a2e;
    }
    #downloadBtn:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      opacity: 0.85;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
      min-height: 18px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .preview-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h2>Grok Imagine Downloader</h2>
  <div class="info">Scans for all currently loaded generated images on grok.com/imagine</div>

  <div class="toggle-row">
    <span>Try full-size (no thumbnail)</span>
    <input type="checkbox" id="fullSize" checked>
  </div>

  <button id="scanBtn">Scan Images</button>
  <button id="downloadBtn" disabled>Download All</button>

  <div id="status"></div>
  <div id="preview" class="preview-grid"></div>

  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
